name: Build dashboard data

# Runs when the Drive exporter (exporter/Code.js) commits new raw NIPUN+ files,
# rebuilds public/data/basti.json and commits it. Can also be run by hand from
# the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'data-prep/build_data.py'
      - 'data-prep/lo_descriptions.csv'
      - 'data-prep/requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data-prep/requirements.txt

      - run: pip install -r data-prep/requirements.txt

      - run: python data-prep/build_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Dashboard data unchanged."
          else
            git commit -m "Rebuild dashboard data"
            git pull --rebase
            git push
          fi
